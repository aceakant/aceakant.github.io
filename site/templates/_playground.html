{# Home page Playground: the four labs #}
<section class="wrap" id="playground">
  <h2 class="sec">Playground</h2>
  <p class="pg-intro">Four labs, one quick game each. Made-up data, real lessons from risk and analytics work. No sign-up, nothing stored.</p>
  <div class="pg-grid">
    {% for l in labs.labs %}
    <a class="pg-card {{ l.color }} reveal" href="{{ l.slug }}.html">
      {% include "_labicon.html" %}
      <span class="mono">{{ l.name }}</span>
      <h3>{{ l.game }}</h3>
      <p>{{ l.hook }}</p>
      <span class="more">Play →</span>
    </a>
    {% endfor %}
  </div>
</section>
