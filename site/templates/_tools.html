{# Home page: the Tools row under the Playground, built from content/tools.yaml (featured, live tools) #}
<section class="wrap" id="tools">
  <h2 class="sec">Workbench</h2>
  {% for t in tools if t.featured and t.status == 'live' %}
  <a class="tool-feature{% if t.style == 'lite' %} tool-lite{% endif %} reveal" href="{{ t.url }}">
    <span class="tool-badge" aria-hidden="true">{{ t.badge }}</span>
    <span class="tool-copy">
      <span class="mono">{{ t.kind }}</span>
      <b>{{ t.name }}</b>
      <span>{{ t.blurb }}</span>
    </span>
    <span class="btn small{% if t.style == 'lite' %} ghost{% endif %}">{{ t.cta }} →</span>
  </a>
  {% endfor %}
  <p class="tools-more"><a href="workbench.html">All tools in the Workbench →</a></p>
</section>
