# STEP 2 — Every hour: send the 24-hour reminder, and publish drafts whose 48-hour window has passed.
# Held drafts and drafts that need review are never published here.
name: 2 · Publish on schedule

on:
  schedule:
    - cron: "11 * * * *"   # twice an hour, so a delayed or dropped GitHub schedule doesn't matter
    - cron: "41 * * * *"
  workflow_dispatch:
  push:                    # also runs once whenever this file changes (self-test)
    branches: [main]
    paths: [".github/workflows/publish.yml"]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check drafts
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scheduler.py
      - name: Save and deploy
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "insights-bot"
          git config user.email "insights-bot@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || (git commit -m "Scheduled publish/reminder" && git push)
          gh workflow run deploy.yml
