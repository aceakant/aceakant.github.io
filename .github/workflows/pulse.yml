# Every morning: fetch the anonymous visit and game counts for the Pulse page, then rebuild the site.
# Does nothing until GoatCounter is set up. Run it any time: edit content/refresh-pulse.txt, or use "Run workflow".
name: 7 · Pulse numbers

on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/refresh-pulse.txt"]

permissions:
  contents: write
  actions: write

concurrency:
  group: pulse          # its own queue, so a waiting article job can't bump it
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch the numbers
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/pulse_fetch.py
      - name: Save and rebuild the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add content/pulse.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No new numbers."; exit 0; fi
          git config user.name "insights-bot"
          git config user.email "insights-bot@users.noreply.github.com"
          git commit -m "Pulse numbers $(date -u +%F)"
          git pull --rebase && git push
          gh workflow run deploy.yml
