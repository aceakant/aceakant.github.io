# Your one-word replies on a "Review:" issue: approve · hold · release · share (post a held article to LinkedIn)
# Only the repository owner's comments are obeyed.
name: 3 · Review commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, 'Review:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply the command
        id: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python scripts/review_command.py
      - name: Save and deploy
        if: steps.cmd.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "insights-bot"
          git config user.email "insights-bot@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || (git commit -m "Review command on #${{ github.event.issue.number }}" && git push)
          gh workflow run deploy.yml
