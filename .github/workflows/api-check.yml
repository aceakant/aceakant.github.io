# Checks the Claude keys and prompt caching with small calls (never writes or publishes anything).
# Keys: VERTAXNODE_ANTHROPIC_API_KEY (weekly VertexNode articles), ANALYST_ANTHROPIC_API_KEY (Analyst on Call),
# ANTHROPIC_API_KEY (old key, kept as the automatic backup). Keys are never printed.
# Run it any time: edit content/check-api.txt, or use "Run workflow".
name: 6 · Claude API check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/check-api.txt"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test each saved Claude key, then each job as it really runs
        env:
          VERTAXNODE_ANTHROPIC_API_KEY: ${{ secrets.VERTAXNODE_ANTHROPIC_API_KEY }}
          ANALYST_ANTHROPIC_API_KEY: ${{ secrets.ANALYST_ANTHROPIC_API_KEY }}
          OLD_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ART_KEY: ${{ secrets.VERTAXNODE_ANTHROPIC_API_KEY || secrets.VERTEXNODE_ANTHROPIC_API_KEY || secrets.VERTAX_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANA_KEY: ${{ secrets.ANALYST_ANTHROPIC_API_KEY || secrets.ANALYST_ANATHROPIC_KEY || secrets.ANALYST_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] && echo "Note: ANTHROPIC_WORKSPACE_ID is set; delete it if your keys belong to a workspace."
          python3 - <<'PY'
          import os
          for n in ["VERTAXNODE_ANTHROPIC_API_KEY", "ANALYST_ANTHROPIC_API_KEY", "OLD_ANTHROPIC_API_KEY"]:
              v = os.environ.get(n, "")
              if not v:
                  print(f"SHAPE {n}: not saved"); continue
              s = v.strip()
              print(f"SHAPE {n}: length {len(v)} | starts like a Claude API key (sk-ant-api): {'yes' if s.startswith('sk-ant-api') else 'NO'}"
                    f" | spaces/line breaks at the ends: {'YES' if s != v else 'no'} | quote marks: {'YES' if any(c in s for c in chr(34) + chr(39)) else 'no'}")
          PY
          for name in VERTAXNODE_ANTHROPIC_API_KEY ANALYST_ANTHROPIC_API_KEY OLD_ANTHROPIC_API_KEY; do
            [ -z "${!name}" ] && continue
            if ANTHROPIC_API_KEY="${!name}" python scripts/api_check.py; then echo "RESULT $name: CONNECTED"; else echo "RESULT $name: FAILED"; fi
          done
          echo "--- As the jobs run (their key, falling back to the old key if it is rejected):"
          ANTHROPIC_API_KEY="$ART_KEY" ANTHROPIC_API_KEY_BACKUP="$OLD_ANTHROPIC_API_KEY" python scripts/api_check.py && echo "RESULT weekly VertexNode job: WILL WORK" || echo "RESULT weekly VertexNode job: WOULD FAIL"
          ANTHROPIC_API_KEY="$ANA_KEY" ANTHROPIC_API_KEY_BACKUP="$OLD_ANTHROPIC_API_KEY" python scripts/api_check.py && echo "RESULT Analyst on Call job: WILL WORK" || echo "RESULT Analyst on Call job: WOULD FAIL"
