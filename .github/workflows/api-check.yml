# Checks the Claude API key and prompt caching with two tiny calls (never writes or publishes anything).
# Run it any time: edit content/check-api.txt, or use "Run workflow".
name: 6 · Claude API check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/check-api.txt"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test each saved Claude key by name (keys are never printed)
        env:
          VERTAX_ANTHROPIC_API_KEY: ${{ secrets.VERTAX_ANTHROPIC_API_KEY }}
          VERTEX_ANTHROPIC_API_KEY: ${{ secrets.VERTEX_ANTHROPIC_API_KEY }}
          ANALYST_ANATHROPIC_KEY: ${{ secrets.ANALYST_ANATHROPIC_KEY }}
          ANALYST_ANTHROPIC_KEY: ${{ secrets.ANALYST_ANTHROPIC_KEY }}
          OLD_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] && echo "Note: ANTHROPIC_WORKSPACE_ID is set; delete it if your keys belong to a workspace."
          for name in VERTAX_ANTHROPIC_API_KEY VERTEX_ANTHROPIC_API_KEY ANALYST_ANATHROPIC_KEY ANALYST_ANTHROPIC_KEY OLD_ANTHROPIC_API_KEY; do
            if [ -z "${!name}" ]; then echo "--- $name: not saved"; continue; fi
            echo "--- $name: found, testing…"
            if ANTHROPIC_API_KEY="${!name}" python scripts/api_check.py; then echo "RESULT $name: CONNECTED"; else echo "RESULT $name: FAILED"; fi
          done
