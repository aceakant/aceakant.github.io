# Checks the Claude API key and prompt caching with two tiny calls (never writes or publishes anything).
# Run it any time: edit content/check-api.txt, or use "Run workflow".
name: 6 · Claude API check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/check-api.txt"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test each saved Claude key by name (keys are never printed)
        env:
          VERTAX_ANTHROPIC_API_KEY: ${{ secrets.VERTAX_ANTHROPIC_API_KEY }}
          VERTEX_ANTHROPIC_API_KEY: ${{ secrets.VERTEX_ANTHROPIC_API_KEY }}
          ANALYST_ANATHROPIC_KEY: ${{ secrets.ANALYST_ANATHROPIC_KEY }}
          ANALYST_ANTHROPIC_KEY: ${{ secrets.ANALYST_ANTHROPIC_KEY }}
          OLD_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] && echo "Note: ANTHROPIC_WORKSPACE_ID is set; delete it if your keys belong to a workspace."
          # Shape of each saved value, to spot copy-paste problems. Never prints the key itself.
          python3 - <<'PY'
          import os
          for n in ["VERTAX_ANTHROPIC_API_KEY", "VERTEX_ANTHROPIC_API_KEY", "ANALYST_ANATHROPIC_KEY", "ANALYST_ANTHROPIC_KEY", "OLD_ANTHROPIC_API_KEY"]:
              v = os.environ.get(n, "")
              if not v:
                  continue
              s = v.strip()
              print(f"SHAPE {n}: length {len(v)} | looks like a Claude API key (starts sk-ant-api): {'yes' if s.startswith('sk-ant-api') else 'NO'}"
                    f" | spaces or line breaks at the ends: {'YES' if s != v else 'no'} | spaces inside: {'YES' if any(c.isspace() for c in s) else 'no'}"
                    f" | quote marks: {'YES' if any(c in s for c in chr(34) + chr(39)) else 'no'}")
          PY
          for name in VERTAX_ANTHROPIC_API_KEY VERTEX_ANTHROPIC_API_KEY ANALYST_ANATHROPIC_KEY ANALYST_ANTHROPIC_KEY OLD_ANTHROPIC_API_KEY; do
            if [ -z "${!name}" ]; then echo "--- $name: not saved"; continue; fi
            echo "--- $name: found, testing…"
            if ANTHROPIC_API_KEY="${!name}" python scripts/api_check.py; then echo "RESULT $name: CONNECTED"; else echo "RESULT $name: FAILED"; fi
          done
          echo "--- As the jobs run it (main key, falling back to the old key if needed):"
          ANTHROPIC_API_KEY="${VERTAX_ANTHROPIC_API_KEY:-${VERTEX_ANTHROPIC_API_KEY:-$OLD_ANTHROPIC_API_KEY}}" ANTHROPIC_API_KEY_BACKUP="$OLD_ANTHROPIC_API_KEY" python scripts/api_check.py && echo "RESULT weekly VertexNode job: WILL WORK" || echo "RESULT weekly VertexNode job: WOULD FAIL"
          ANTHROPIC_API_KEY="${ANALYST_ANATHROPIC_KEY:-${ANALYST_ANTHROPIC_KEY:-$OLD_ANTHROPIC_API_KEY}}" ANTHROPIC_API_KEY_BACKUP="$OLD_ANTHROPIC_API_KEY" python scripts/api_check.py && echo "RESULT Analyst on Call job: WILL WORK" || echo "RESULT Analyst on Call job: WOULD FAIL"
