# The Workbench: every tool on the site. Add a new tool by adding an entry; the Workbench page and the home
# page's Tools row are built from this list (featured tools also appear on the home page, in this order).
#   status: live = has its own page (url); next = shown as "Coming soon", no link
#   style:  ai = maker-checker AI tool (teal); lite = free tool with no AI (amber)
tools:
  - id: analyst
    name: Analyst on Call
    badge: AI
    style: ai
    kind: Maker-checker AI
    status: live
    url: analyst.html
    cta: Try it
    featured: true
    blurb: Drop in a loan book, transactions or fraud-alert file. One AI drafts the findings, a second checks every number, and you get a final conclusion.
    facts: ["3 samples or your own CSV", "Your file stays in your browser", "5 free reviews"]
    tags: [Credit, Fraud, Data quality]

