# The Playground: four labs. The first game in each list is the newest (featured);
# older games move to the 'Earlier games' shelf on the same lab page. All data is made up for play.
labs:
- slug: analytics-lab
  name: Analytics Lab
  teaches: Reading data quickly, and remembering that correlation is not causation.
  color: teal
  games:
  - id: chart-tricks
    name: Spot the chart trick
    part: chart
    added: November 2026
    new: true
    hook: A chart that makes 2% look like 300%? Find the trick before it fools your boss.
  - id: correlation
    name: Guess the correlation
    part: corr
    added: October 2026
    hook: Chai vs code, rain vs umbrellas. How strongly do they move together?
- slug: risk-lab
  name: Risk Lab
  teaches: The trade-off every lender makes between growth, losses and profit.
  color: amber
  games:
  - id: survive-recession
    name: Survive the recession
    part: book
    added: November 2026
    new: true
    hook: Build a ₹100 crore loan book. Earn the most, but don't lose money when the recession hits.
  - id: cut-off
    name: Run the bank for a day
    part: riskcut
    added: October 2026
    hook: Set the approval cut-off. Too strict loses customers, too loose loses money.
- slug: fraud-lab
  name: Fraud Lab
  teaches: The early signals fraud teams use to stop losses before they happen.
  color: red
  games:
  - id: scam-or-legit
    name: Scam or legit?
    part: phish
    added: November 2026
    new: true
    hook: Six messages land on your phone. Which ones are trying to rob you?
  - id: spot-the-fraud
    name: Spot the fraud
    part: spotfraud
    added: October 2026
    hook: A fraud ring, a card-testing attack and a money mule. Can you catch all three?
- slug: framework-lab
  name: Framework Lab
  teaches: How risk responsibilities are split, and the difference between a KPI and a KRI.
  color: green
  games:
  - id: in-order
    name: Put it in order
    part: order
    added: November 2026
    new: true
    hook: Making chai, launching a model, handling an incident. What comes first?
  - id: sort-it-out
    name: Sort it out
    part: sort
    added: October 2026
    hook: Who plays which line of defence, at a cricket match and in a bank?
analytics:
  rounds:
  - x: Cups of chai before noon
    y: Lines of code written
    r: 0.62
    quip: Strong-ish. But is it the chai, or do early starters just drink more chai?
  - x: Rainy days in the month
    y: Umbrellas sold
    r: 0.91
    quip: Very strong, and here the cause really is obvious.
  - x: Shoe size
    y: Exam marks
    r: 0.03
    quip: Basically nothing. Big feet won't save you in maths.
  - x: Hours of late-night cricket
    y: Hours of sleep
    r: -0.78
    quip: 'Strongly negative: one goes up, the other goes down.'
  - x: Ice-cream sales
    y: Swimming-pool visits
    r: 0.71
    quip: Strong, but neither causes the other. Hot weather drives both.
