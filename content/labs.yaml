framework:
  rounds:
  - title: Cricket edition
    intro: A cricket match runs on three lines of defence too. Who plays which line?
    buckets:
    - '1st line: does the work, owns the risk'
    - '2nd line: sets the rules, watches'
    - '3rd line: independent review'
    items:
    - text: The batter decides whether to play each ball
      answer: 0
    - text: The on-field umpire applies the rules in real time
      answer: 1
    - text: The match referee reviews the whole match afterwards
      answer: 2
    - text: The bowler sticks to the no-ball line
      answer: 0
  - title: Banking edition
    intro: Now the real thing. Place each task in the right line of defence.
    buckets:
    - '1st line: business & operations'
    - '2nd line: risk & compliance'
    - '3rd line: internal audit'
    items:
    - text: Branch officer checks a customer's ID
      answer: 0
    - text: Fraud strategy team sets transaction limits
      answer: 1
    - text: Internal audit tests whether fraud controls work
      answer: 2
    - text: Product team builds checks into a loan journey
      answer: 0
    - text: Compliance reviews a new product against regulation
      answer: 1
  - title: KPI or KRI?
    intro: A KPI tracks performance. A KRI warns you that risk is building. Which is which?
    buckets:
    - 'KPI: how well are we doing?'
    - 'KRI: is risk building up?'
    items:
    - text: Loans approved per day
      answer: 0
    - text: Applications from the same device in 24 hours
      answer: 1
    - text: Average time to approve a loan
      answer: 0
    - text: Loans missing a payment in the first 3 months
      answer: 1
    - text: Customer satisfaction score
      answer: 0
    - text: Fraud losses as a share of new lending
      answer: 1
charts:
  rounds:
  - title: '"Sales tripled this year!"'
    kind: bar
    bars:
    - label: Last year
      v: 102
    - label: This year
      v: 104
    ymin: 100
    ymax: 105
    options:
    - The y-axis starts at 100, so a 2% rise looks like 3×
    - The bars are the wrong colour
    - There should be more years shown
    answer: 0
    explain: 'Sales went from 102 to 104: up about 2%. Starting the axis at 100 makes the second bar look three times taller.'
  - title: '"Customer complaints are rising fast"'
    kind: line
    series:
    - 60
    - 58
    - 55
    - 57
    - 52
    - 50
    - 48
    - 46
    - 40
    - 41
    - 43
    - 46
    window: 4
    options:
    - The line should be a bar chart
    - Only the last 4 months are shown; over the year complaints fell sharply
    - Complaints should be shown as a percentage
    answer: 1
    explain: Zoom out and complaints fell from 60 to 46 over the year. Picking the last four months tells the opposite story.
  - title: '"Office survey: favourite snack"'
    kind: pie
    slices:
    - label: Samosa
      v: 45
    - label: Biscuits
      v: 40
    - label: Fruit
      v: 30
    - label: Chips
      v: 15
    options:
    - Pie charts should be 3D
    - Fruit is under-reported
    - The slices add up to 130%, so people could pick more than one
    answer: 2
    explain: 45 + 40 + 30 + 15 = 130%. A pie only works when every answer is exclusive and the parts add up to 100%.
  - title: '"Average salary at our 10-person startup: ₹42 lakh"'
    kind: people
    values:
    - 8
    - 8
    - 8
    - 8
    - 8
    - 8
    - 8
    - 8
    - 8
    - 348
    unit: L
    options:
    - One founder's pay drags the average up; the typical person earns ₹8 lakh
    - Startups always pay well
    - The chart needs a legend
    answer: 0
    explain: Nine people earn ₹8 lakh and one earns ₹3.48 crore. The average is ₹42 lakh, but the median, the honest number here, is ₹8 lakh.
