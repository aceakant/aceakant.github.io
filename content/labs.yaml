phish:
  messages:
  - from: VM-YRBANK
    text: 'Dear customer, your KYC expires today. Update now or your account will be BLOCKED: http://yourbank-kyc-update.xyz'
    scam: true
    flags:
    - Urgent threat ("BLOCKED", "today")
    - A strange web address that isn't the bank's site
    - Banks don't ask for KYC via SMS links
  - from: VM-YRBANK
    text: ₹2,450 debited from A/c XX4417 at CITY GROCERS on 01-Nov. Not you? Call the number on the back of your card.
    scam: false
    flags:
    - No link to click
    - Doesn't ask for any details
    - Points you to the number you already have
  - from: +91 98xxx xx210
    text: 'Your parcel is on hold due to unpaid customs fee of ₹49. Pay here to release: bit.ly/parcel-fee'
    scam: true
    flags:
    - A tiny fee to make you lower your guard
    - Shortened link hides the real address
    - Sent from a personal mobile number
  - from: HR Team
    text: Congratulations! Work from home, earn ₹8,000/day liking videos. Pay ₹500 registration to start.
    scam: true
    flags:
    - Too good to be true
    - You pay them to get a job
    - No company name, no interview
  - from: VM-YRBANK
    text: Your OTP for login is 482910. Valid for 5 minutes. Never share your OTP with anyone, including bank staff.
    scam: false
    flags:
    - Expected if you just tried to log in
    - Warns you not to share it
    - No link, no request
  - from: UPI Request
    text: Rohit has sent you a request of ₹4,999. Enter your UPI PIN to RECEIVE the money.
    scam: true
    flags:
    - You never need a PIN to receive money
    - A PIN means money is leaving your account
    - Pressure to act fast on a "collect" request
order:
  rounds:
  - title: Chai, the governance way
    intro: Even chai has a lifecycle. Put the steps in the right order.
    steps:
    - Ask who wants chai and how they like it
    - Check the milk, sugar and tea leaves
    - Brew the chai
    - Taste a sip before serving
    - Get a nod from the chai expert
    - Serve everyone
    - Check if anyone wants a refill
  - title: Launching a risk model
    intro: From idea to production, the way a regulator would expect it.
    steps:
    - Define the business problem
    - Collect and check the data
    - Build the model
    - Independent validation
    - Approval at the model risk committee
    - Deploy into production
    - Monitor performance and review
  - title: Handling a fraud incident
    intro: A fraud attack is under way. What do you do, in order?
    steps:
    - Detect the unusual activity
    - 'Contain it: block cards or accounts'
    - Investigate the root cause
    - Fix the weak control
    - Report to leadership and regulators
    - Learn and update the rules
