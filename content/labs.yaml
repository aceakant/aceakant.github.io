phish:
  messages:
  - from: YourBank
    text: 'Dear customer, your account details expire today. Verify now or your account will be BLOCKED: http://yourbank-verify-update.xyz'
    scam: true
    flags:
    - Urgent threat ("BLOCKED", "today")
    - A strange web address that isn't the bank's site
    - Banks don't ask you to verify your details through text-message links
  - from: YourBank
    text: $24.50 spent on your card ending 4417 at CITY GROCERS on 01-Nov. Not you? Call the number on the back of your card.
    scam: false
    flags:
    - No link to click
    - Doesn't ask for any details
    - Points you to the number you already have
  - from: +44 7xxx xxx210
    text: 'Your parcel is on hold due to an unpaid customs fee of £1.99. Pay here to release: bit.ly/parcel-fee'
    scam: true
    flags:
    - A tiny fee to make you lower your guard
    - Shortened link hides the real address
    - Sent from a personal mobile number
  - from: HR Team
    text: Congratulations! Work from home, earn $300 a day liking videos. Pay a $25 registration fee to start.
    scam: true
    flags:
    - Too good to be true
    - You pay them to get a job
    - No company name, no interview
  - from: YourBank
    text: Your one-time code for login is 482910. Valid for 5 minutes. Never share this code with anyone, including bank staff.
    scam: false
    flags:
    - Expected if you just tried to log in
    - Warns you not to share it
    - No link, no request
  - from: Payment request
    text: Sam has sent you a payment request of $49.99. Enter your PIN to RECEIVE the money.
    scam: true
    flags:
    - You never need a PIN to receive money
    - A PIN means money is leaving your account
    - Pressure to act fast on a payment request
order:
  rounds:
  - title: Chai, the governance way
    intro: Even chai has a lifecycle. Put the steps in the right order.
    steps:
    - Ask who wants chai and how they like it
    - Check the milk, sugar and tea leaves
    - Brew the chai
    - Taste a sip before serving
    - Get a nod from the chai expert
    - Serve everyone
    - Check if anyone wants a refill
  - title: Launching a risk model
    intro: From idea to production, the way a regulator would expect it.
    steps:
    - Define the business problem
    - Collect and check the data
    - Build the model
    - Independent validation
    - Approval at the model risk committee
    - Deploy into production
    - Monitor performance and review
  - title: Handling a fraud incident
    intro: A fraud attack is under way. What do you do, in order?
    steps:
    - Detect the unusual activity
    - 'Contain it: block cards or accounts'
    - Investigate the root cause
    - Fix the weak control
    - Report to leadership and regulators
    - Learn and update the rules
# How sure are you? (Analytics Lab): points = 100 - 400 x (1 - chance you gave the right answer)^2, so 50% sure scores 0,
# 99% sure and right scores 100, and 99% sure and wrong scores -292 (a Brier score, as used to grade forecasters).
sure:
  levels: [55, 70, 85, 99]
  rounds:
  - text: Toss a fair coin 10 times. Getting exactly 5 heads is more likely than not.
    answer: false
    why: Exactly 5 heads happens only about 25% of the time (252 of the 1,024 equally likely sequences). It's the most likely single result, but far from a sure thing.
  - text: In a group of 23 people, it's more likely than not that two of them share a birthday.
    answer: true
    why: 23 people make 253 different pairs, so a match is likely. The chance is about 51%.
  - text: Money growing at 7% a year doubles in about 10 years.
    answer: true
    why: 1.07 multiplied by itself 10 times is about 1.97. The "rule of 72" agrees, since 72 ÷ 7 is about 10.
  - text: A test finds 99% of people who have an illness and wrongly flags 1% of healthy people. 1 in 1,000 people has the illness. If you test positive, you most likely have it.
    answer: false
    why: In 100,000 people, 99 of the 100 who are ill test positive, but so do 999 healthy people. Only about 1 positive in 11 is really ill.
  - text: To halve a survey's margin of error, you need twice as many people.
    answer: false
    why: The margin of error shrinks with the square root of the sample size, so halving it takes four times as many people.
  - text: Fraud is 0.1% of payments, and a fraud model flags 1% of payments. Even at best, no more than 1 in 10 of its alerts can be fraud.
    answer: true
    why: Even if every fraud is flagged, 0.1% fraud inside 1% flagged is 1 alert in 10. When fraud is rare, false alarms are unavoidable.
  - text: If two things have a correlation of zero, there is no relationship between them.
    answer: false
    why: Correlation only measures straight-line patterns. Points on a perfect U-shape (y = x² for x from −3 to 3) have a correlation of exactly zero, yet x decides y completely.
  - text: On a game show you pick 1 of 3 doors. The host, who knows where the prize is, opens another door with nothing behind it. Switching to the last door wins 2 times in 3.
    answer: true
    why: Your first pick is right only 1 time in 3. In the other 2 times in 3, the host has to leave the prize behind the last door, so switching wins.
