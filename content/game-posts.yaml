# Playground games and Workbench tools on LinkedIn: one post every 3rd day, posted by the hourly publish job.
# Each game has its own share link (play/<id>.html) whose preview is the real game screen; tools link to their page.
# Which one goes next is decided on the day: anything never posted yet goes first (so a new game or a newly
# launched tool is posted at the next slot, even if it isn't listed below), then whatever was posted longest ago.
# Each repeat of the same game or tool uses the next style of text, so no post is a copy.
# To stop: set enabled: false. To pause one post: add its number to skip.
enabled: true
start: "2026-11-10"        # post #1 went out on 10 Nov (the video post); then every 3rd day
every_days: 3
days: 90                   # 30 posts: 10 Nov 2026 to 5 Feb 2027
time: "12:47"              # India time; Saturdays move to the evening so they don't sit on top of the weekly article
saturday_time: "19:17"
skip: [1]                  # slot 1 is the video post made on 10 Nov (content/post-now.yaml)

# order of the queue: game, VertexNode article, game, Workbench tool, then round again
mix: [game, article, game, tool]

# the first line of every post says what it is, so people know what they're clicking into
labels:
  game: "🎮 Playground game · {lab_name} · free {time} play"
  tool: "🛠️ Workbench tool · {name} · free to try"
  article: "📰 VertexNode weekly analysis · {market_label}{category}"

# Teasers and launch posts. When a tool or game has a launch time (tools.yaml / labs.yaml `launch:`), or an article
# has a time to go out on LinkedIn, a teaser goes out the day before. One post a day: if that day already has a post
# (an article going out, another teaser or launch), the teaser moves a day earlier, and regular slots move a day later.
# Tools and games also get a launch post on the day (an article's own LinkedIn post is its launch).
teaser_styles:
  tool: |-
    🔜 Coming {when_word} on the Workbench: {name}

    {blurb}

    Free, and live {launch_day}. Watch this space 👉 {url}

    What would you want it to show? Tell me below. 👇
  game: |-
    🔜 New game in the Playground {when_word}: {name}

    {blurb}

    Free, no sign-up, live {launch_day}. The other games are here meanwhile 👉 {url}

    Who's going to top the Hall of Fame? 🏆
  article: |-
    🔜 {when_cap} on VertexNode: {topic}

    {question} 🤔

    Leave your guess below. 👇 I'll share the answer, the numbers and what to do about it {launch_day}.

    Past issues 👉 {url}
launch_styles:
  tool: |-
    🚀 Live now on the Workbench: {name}

    {blurb}

    Free to try 👉 {url}

    Tell me what you find. 👇
  game: |-
    🚀 New in the Playground: {name}

    {blurb}

    Play free, no sign-up 👉 {url}

    Post your score in the comments. 🏆

# articles are re-shared only once their own first LinkedIn post is this many days old,
# and never on a day a new article goes out on LinkedIn
article_rest_days: 21

# {hook} {teaser} {time} {more} {lesson} {url} come from each game below
styles:
  - name: puzzle
    text: |-
      {hook}

      {teaser}

      Comment your answer before you check. 👇

      Then {more} in a {time} game (free, no sign-up):
      {url}
  - name: score
    text: |-
      {hook}

      {blurb}

      Play free, no sign-up 👉 {url}

      Post your score in the comments. 🏆
  - name: tag
    text: |-
      Who on your team would get this right first? 🤔

      {hook}

      {blurb}

      {time} game, free, no sign-up: {url}

      Tag them below. 👇
  - name: lesson
    text: |-
      {lesson}

      I turned it into a {time} game so you can test yourself:
      {hook}

      Play free 👉 {url}

      What did you score?

games:
  - id: chart-tricks
    lab: analytics-lab
    title: "This chart is lying. Can you tell how?"
    description: "4 charts, 4 tricks, 90 seconds. Spot what each one hides before it fools your boss. Free, no sign-up."
    hook: "This chart is lying. Can you tell how? 📊"
    teaser: '"Sales tripled this year!"'
    more: "spot 3 more tricks"
    blurb: "4 charts you might see in a board pack. Each one hides a trick that changes the story: squashed axes, cherry-picked dates, impossible pies and sneaky averages."
    lesson: "Most misleading charts don't use fake data. A cropped axis or a hand-picked time window does the job."
    time: "90-second"
    hashtags: [DataVisualization, Analytics, DataLiteracy]
  - id: scam-or-legit
    lab: fraud-lab
    title: "Six messages. Which ones are trying to rob you?"
    description: "Account alerts, parcel fees, job offers, one-time codes. Decide in a tap, then see the red flags a fraud analyst would spot."
    hook: "Six messages. Which ones are trying to rob you? 📱"
    teaser: "An account alert, a parcel fee, a job offer, a one-time code. Which would you trust?"
    more: "check all six"
    blurb: "The messages everyone gets: account alerts, parcel fees, job offers, one-time codes, payment requests. Decide in a tap, then see the red flags a fraud analyst would spot."
    lesson: "Most scams don't look like scams. They look like a parcel fee, a job offer or a code you were 'expecting'."
    time: "60-second"
    hashtags: [FraudPrevention, CyberSecurity, ScamAwareness]
  - id: survive-recession
    lab: risk-lab
    title: "Can your loan book survive a recession?"
    description: "You have $100 million to lend. Riskier loans pay more, until a recession hits. Build a book that earns and survives."
    hook: "You have $100 million to lend. Can your loan book survive a recession? 📉"
    teaser: "Riskier loans pay more, until the recession hits. How would you split the money?"
    more: "build your book"
    blurb: "Spread $100 million across four loan products. Earn a profit in a normal year, without making a loss when the recession hits."
    lesson: "The loans that earn the most in a good year are often the ones that hurt most in a bad one."
    time: "2-minute"
    hashtags: [CreditRisk, RiskManagement, Banking]
  - id: correlation
    lab: analytics-lab
    title: "How strongly do they move together?"
    description: "Guess the correlation between two everyday things, from −1 to +1. Five rounds, best score 500."
    hook: "Chai vs code. Rain vs umbrellas. How strongly do they move together? ☕"
    teaser: "Guess the correlation, from −1 (perfectly opposite) to +1 (perfectly together)."
    more: "play all five rounds"
    blurb: "Each round shows made-up data on two everyday things. Slide to guess the correlation. Five rounds, best score 500."
    lesson: "Correlation is not causation. And even guessing how strong a correlation is turns out to be harder than it looks."
    time: "60-second"
    hashtags: [DataScience, Statistics, Analytics]
  - id: spot-the-fraud
    lab: fraud-lab
    title: "A fraud ring, a card-testing attack and a money mule. Can you catch all three?"
    description: "Pick the one case you would block, and see the signal that gives it away. Three quick rounds."
    hook: "A fraud ring, a card-testing attack and a money mule. Can you catch all three? 🕵️"
    teaser: "Fraud teams decide in seconds which application, payment or account to stop. Which one would you block?"
    more: "catch all three"
    blurb: "Fraud teams decide in seconds which application, payment or account to stop. Three quick rounds: pick the one to block, then see the signal that gives it away."
    lesson: "Fraud rarely hides in one big transaction. It shows up in small patterns: many cards, one device; many accounts, one address."
    time: "60-second"
    hashtags: [FraudPrevention, FraudDetection, RiskManagement]
  - id: cut-off
    lab: risk-lab
    title: "Set the cut-off. Make the most profit."
    description: "10,000 people applied for a loan today. Set the credit-score cut-off: too strict loses customers, too loose loses money."
    hook: "10,000 people applied for a loan today. Where would you set the cut-off? 🏦"
    teaser: "Each good loan earns $1,200. Each bad loan loses $7,000. 8% won't pay you back."
    more: "run the bank for a day"
    blurb: "Everyone has a credit score. Approve everyone above your cut-off. Too strict loses customers, too loose loses money."
    lesson: "Every lender runs on one trade-off: approve more and grow, or approve fewer and lose less. The cut-off is where you choose."
    time: "2-minute"
    hashtags: [CreditRisk, Lending, Analytics]
  - id: in-order
    lab: framework-lab
    title: "What comes first?"
    description: "Making chai, launching a model, handling an incident. Tap the steps in the order you would do them."
    hook: "Making chai, launching a model, handling an incident. What comes first? ☕"
    teaser: "Validate before you approve? Contain before you investigate? Put the steps in order."
    more: "put all three in order"
    blurb: "Good frameworks are mostly about order: you validate before you approve, and you contain before you investigate. Start with chai."
    lesson: "Good frameworks are mostly about order. Validate before you approve. Contain before you investigate."
    time: "2-minute"
    hashtags: [RiskManagement, ModelRisk, Leadership]
  - id: sort-it-out
    lab: framework-lab
    title: "Who owns which risk?"
    description: "The three lines of defence, at a cricket match and in a bank. Sort who does what."
    hook: "Who owns which risk: at a cricket match, and in a bank? 🏏"
    teaser: "The people doing the work, the people setting the rules, the people checking independently. Who is who?"
    more: "sort them all"
    blurb: "Banks split risk work into three lines of defence: doing the work, setting the rules, checking independently. Start with cricket, then try the real thing."
    lesson: "Three lines of defence sounds like jargon until you sort real roles into them. Then it's obvious who owns what."
    time: "2-minute"
    hashtags: [RiskManagement, Governance, Banking]

# Workbench tools. A live tool that isn't listed here is still posted, using its name and blurb from tools.yaml.
article_styles:
  - name: quiz
    text: |-
      {question} 🤔

      Guess before you read on. 👇

      The answer, and what it means in practice: {title}

      Read it free 👉 {url}
  - name: result
    text: |-
      {title}

      {summary}

      Read the full analysis, with the interactive calculator and sources 👉 {url}
  - name: star
    text: |-
      The problem: {situation}

      What to do: {action}

      What it's worth: {result}

      The full case, step by step 👉 {url}

tool_styles:
  - name: problem
    text: |-
      {hook}

      {blurb}

      I built a free tool for it. Try it here 👉 {url}

      What would you add?
  - name: try
    text: |-
      {question}

      {blurb}

      Try it free, nothing to install: {url}

      Post your result in the comments. 👇
  - name: lesson
    text: |-
      {lesson}

      That's why I built {name}: {short}

      Free to try 👉 {url}
  - name: ask
    text: |-
      Quick question for risk and data people: {question}

      I built {name} to answer it in a few minutes: {url}

      Tell me what you find. 👇

tools:
  - id: fraud-roi
    hook: "A fraud model that catches 90% of fraud can still lose money. 💸"
    question: "What does your fraud model really save once false alarms and review costs are counted?"
    lesson: "Detection rate is only half the story. Every false alarm costs a review and annoys a genuine customer."
    short: "move the sliders and see the net saving, return and payback."
    hashtags: [FraudPrevention, RiskAnalytics, Banking]
  - id: model-risk
    hook: "Would your model pass a regulator's review tomorrow? 📋"
    question: "How ready is your credit, fraud or AI model for the regulator?"
    lesson: "Most model findings aren't about the maths. They're about missing evidence: who approved it, how it was tested, who monitors it."
    short: "10 quick questions, the gaps to fix first and the evidence to keep."
    hashtags: [ModelRisk, RiskManagement, AIGovernance]
  - id: cut-off-studio
    hook: "Move a credit-score cut-off by 20 points. What happens to profit? 📈"
    question: "Where should the credit-score cut-off sit, in a normal year and in a downturn?"
    lesson: "A cut-off is never just a number. Approval rate, bad rate, expected loss and profit all move together."
    short: "move the cut-off on a sample loan book and watch all four change, in a normal year and a downturn."
    hashtags: [CreditRisk, Lending, Analytics]
  - id: analyst
    hook: "One AI drafts the findings. A second AI checks every number. 🤖"
    question: "Can AI analyse a loan book or fraud-alert file without making numbers up?"
    lesson: "The risk with AI in analytics isn't that it can't find patterns. It's that it states numbers it never checked."
    short: "drop in a file, one AI drafts the findings and a second checks every number."
    hashtags: [GenAI, RiskAnalytics, DataAnalytics]
