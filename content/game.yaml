# "Spot the fraud" game on the Home page. All cases are fictional.
# Each round: 4 cases, exactly one with fraud: true.

rounds:
  - name: "Loan applications"
    prompt: "Four personal-loan applications landed this morning. One is a fraud ring. Which?"
    cases:
      - id: "APP-2041"
        title: "₹6.5L personal loan"
        lines: ["Salaried, 7 yrs at same employer", "Mobile number active 9 yrs", "Address matches bureau record"]
        fraud: false
      - id: "APP-2042"
        title: "₹2L personal loan"
        lines: ["Self-employed, 3 yrs ITR filed", "Applied at 2:14 AM", "Bank statement shows steady inflows"]
        fraud: false
      - id: "APP-2043"
        title: "₹4.9L personal loan"
        lines: ["Salaried, new job (2 months)", "Mobile number active for 3 days", "Device used by 14 other applications this week"]
        fraud: true
        why: "One phone filing 14 applications in a week, plus a 3-day-old number, is a classic fraud-ring signal. Device velocity checks catch this at the door."
      - id: "APP-2044"
        title: "₹9L personal loan"
        lines: ["Higher amount than usual", "Long credit history, no defaults", "Existing customer for 6 yrs"]
        fraud: false
  - name: "Card transactions"
    prompt: "Same card, four transactions today. One should be blocked. Which?"
    cases:
      - id: "TXN-8810"
        title: "₹1,240 · grocery store"
        lines: ["Usual neighbourhood", "Chip + PIN", "Matches weekly pattern"]
        fraud: false
      - id: "TXN-8811"
        title: "₹38,500 · airline tickets"
        lines: ["Large, but booked on the bank's app", "Customer travels quarterly", "OTP confirmed"]
        fraud: false
      - id: "TXN-8812"
        title: "₹49,999 · electronics, online"
        lines: ["2 minutes after a ₹1 charge abroad", "New shipping address", "Just under a ₹50,000 alert limit"]
        fraud: true
        why: "A ₹1 'test' charge followed by a big purchase just under the alert limit is card-testing then cash-out. Rules that link the two events stop it."
      - id: "TXN-8813"
        title: "₹499 · streaming renewal"
        lines: ["Recurring every month", "Same merchant for 3 years", "Same amount"]
        fraud: false
  - name: "New accounts"
    prompt: "Four savings accounts opened last week. One is a money mule. Which?"
    cases:
      - id: "ACC-3301"
        title: "Student account"
        lines: ["Small monthly transfer from parent", "Card used near college", "Low balance"]
        fraud: false
      - id: "ACC-3302"
        title: "Salary account"
        lines: ["Salary credited on the 1st", "Rent paid on the 3rd", "Regular bill payments"]
        fraud: false
      - id: "ACC-3303"
        title: "Savings account"
        lines: ["23 small UPI credits from different senders", "All of it moved out within an hour", "No other activity"]
        fraud: true
        why: "Many small credits from strangers, then everything moved out fast, is a money-mule pattern. Flow-based monitoring spots it within hours."
      - id: "ACC-3304"
        title: "Business account"
        lines: ["Many UPI credits from customers", "Matches a registered shop", "Daily deposits to supplier"]
        fraud: false
